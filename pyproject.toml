[project]
name = "btc-investor-tui"
version = "0.7.1"
description = "Textual BTC investor terminal with pixel charts, deterministic order blocks, technical indicators, macro intel, news, and AI commentary"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Muhamad Bari" }
]
urls = { Repository = "https://github.com/muhamad-bari/btc-terminal" }
keywords = ["bitcoin", "btc", "terminal", "tui", "textual", "technical-analysis", "order-blocks", "macro", "yahoo-finance", "investing"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
  "feedparser>=6.0.12",
  "matplotlib>=3.10.0",
  "pandas>=2.3.0",
  "pillow>=12.0.0",
  "plotille>=5.0.0",
  "smartmoneyconcepts>=0.0.27",
  "ta>=0.11.0",
  "textual>=6.0.0",
  "textual-image>=0.12.0",
  "yfinance>=0.2.66",
]

[project.scripts]
btc-tui = "btc_investor_tui.app:main"

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["tradingview_mcp*", "btc_investor_tui*"]

[tool.setuptools.package-data]
tradingview_mcp = ["coinlist/*.txt"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]

[tool.uv]
package = true

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
